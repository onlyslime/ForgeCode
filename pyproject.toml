[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forgecode"
version = "0.2.0"
description = "A self-built, auditable coding agent framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prompt_toolkit>=3.0.43,<4"]

[project.scripts]
forgecode = "forgecode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgecode"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
